let currentUrl=null;
function decode64(b64){
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function navigateEmbedded(target){
  target=String(target||'index.html');
  const parts=target.split('#'), file=parts[0]||'index.html', anchor=parts[1]||'';
  const key=DATA[file]?file:'index.html';
  const html=decode64(DATA[key]);
  if(currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  document.getElementById('loading').style.display='grid';
  document.getElementById('frame').src=currentUrl+(anchor?'#'+encodeURIComponent(anchor):'');
}
window.addEventListener('message',e=>{
  if(e.data&&e.data.type==='sharaka-nav') navigateEmbedded(e.data.target);
});
document.getElementById('frame').addEventListener('load',()=>document.getElementById('loading').style.display='none');
navigateEmbedded('index.html');
</script>
